# Wrangler config for zubrameet-signal Worker.
#
# Этот Worker используется как WebSocket signaling-сервер для CFSFUConnection
# в /web/src/lib/cf-sfu.ts. Каждая видео-комната — отдельный Durable Object
# instance, держит presence и форвардит SDP/ICE между peer'ами.
#
# Deploy:
#   cd cf-workers/zubrameet-signal
#   npx wrangler login          # один раз — OAuth через браузер
#   npx wrangler deploy
#
# При первом deploy миграция [[migrations]] new_classes=["RoomDO"] зарегистрирует
# класс RoomDO как Durable Object в CF. Без этой миграции dashboard выдаёт
# "No Durable Object found" на странице Bindings — поэтому раньше не работало.

name = "zubrameet-signal"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Привязка Durable Object 'ROOMS' (имя env-переменной в Worker'е) → класс RoomDO.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# Migration v1 — регистрирует RoomDO как новый DO-класс. Указываем явно,
# чтобы wrangler знал что это первая миграция и создал нужные ресурсы в CF.
[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]
